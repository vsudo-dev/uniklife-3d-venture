<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">Connect WhatsApp Business to UNIKLIFE</title><desc id="desc">Six setup steps followed by a message flow diagram. UNIKLIFE sends through Meta Cloud API to a customer. Signed webhooks return replies and delivery events.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#4ade80"/></marker></defs>
<rect width="1200" height="620" rx="24" fill="#0f172a"/>
<g font-family="Arial, sans-serif"><text x="45" y="55" fill="#f8fafc" font-size="30" font-weight="700">Your WhatsApp connection, step by step</text><text x="45" y="86" fill="#cbd5e1" font-size="17">Administrator setup → business signup → delivery confirmation</text>
<g fill="#17283b" stroke="#475569"><rect x="45" y="120" width="350" height="112" rx="14"/><rect x="425" y="120" width="350" height="112" rx="14"/><rect x="805" y="120" width="350" height="112" rx="14"/><rect x="45" y="255" width="350" height="112" rx="14"/><rect x="425" y="255" width="350" height="112" rx="14"/><rect x="805" y="255" width="350" height="112" rx="14"/></g>
<g fill="#4ade80" font-size="19" font-weight="700"><text x="65" y="152">01  Prepare business</text><text x="445" y="152">02  Configure Meta app</text><text x="825" y="152">03  Set server settings</text><text x="65" y="287">04  Verify webhook</text><text x="445" y="287">05  Connect with Meta</text><text x="825" y="287">06  Confirm delivery</text></g>
<g fill="#e2e8f0" font-size="16"><text x="65" y="183">Business administrator access</text><text x="65" y="208">Phone number you can verify</text><text x="445" y="183">WhatsApp + Embedded Signup</text><text x="445" y="208">Save app and configuration IDs</text><text x="825" y="183">Vercel production variables</text><text x="825" y="208">Database migration + redeploy</text><text x="65" y="318">Callback URL + matching token</text><text x="65" y="343">Subscribe to messages</text><text x="445" y="318">Choose business and number</text><text x="445" y="343">Finish signup and permissions</text><text x="825" y="318">Send test to opted-in recipient</text><text x="825" y="343">Check status and inbound reply</text></g>
<text x="45" y="417" fill="#f8fafc" font-size="22" font-weight="700">How messages travel</text>
<g fill="#17283b" stroke="#4ade80"><rect x="45" y="445" width="250" height="66" rx="12"/><rect x="475" y="445" width="250" height="66" rx="12"/><rect x="905" y="445" width="250" height="66" rx="12"/></g>
