<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="t d"><title id="t">How a completed customer site visit shows on Google Maps</title><desc id="d">A map with a circular site geofence, a route from the start to the site and back, markers for start, site and end, and a timeline listing trip started, entered geofence, visit completed, returned.</desc>
<rect width="960" height="460" fill="#ffffff"/>
<g font-family="Arial,sans-serif">
<text x="24" y="34" font-size="20" font-weight="700" fill="#111827">What you see after a customer site visit (Site visits → Trip tracking → Timeline)</text>
<rect x="24" y="52" width="560" height="380" rx="12" fill="#e5efe4" stroke="#cbd5e1"/>
<path d="M24 190 C160 170 250 230 584 200" stroke="#fff" stroke-width="14" fill="none"/><path d="M300 52 C310 160 280 300 330 432" stroke="#fff" stroke-width="12" fill="none"/><path d="M24 330 C200 340 420 300 584 350" stroke="#fff" stroke-width="10" fill="none"/>
<rect x="60" y="80" width="120" height="70" rx="6" fill="#d4e6d0"/><rect x="430" y="90" width="110" height="60" rx="6" fill="#d4e6d0"/>
<circle cx="380" cy="250" r="92" fill="#fbbf24" fill-opacity="0.2" stroke="#b45309" stroke-width="3" stroke-dasharray="7 5"/>
<polyline points="90,390 150,360 210,330 270,300 330,270 372,252" fill="none" stroke="#1d4ed8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="372,252 420,236 470,262 500,320 440,380" fill="none" stroke="#7c3aed" stroke-width="4" stroke-dasharray="1 8" stroke-linecap="round"/>
<g><circle cx="90" cy="390" r="15" fill="#16a34a" stroke="#fff" stroke-width="3"/><text x="90" y="395" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">S</text></g>
<g><circle cx="440" cy="380" r="15" fill="#0ea5e9" stroke="#fff" stroke-width="3"/><text x="440" y="385" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">E</text></g>
<g><rect x="360" y="232" width="40" height="40" rx="8" fill="#f59e0b" stroke="#fff" stroke-width="3"/><text x="380" y="257" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">Site</text></g>
<rect x="276" y="320" width="150" height="40" rx="8" fill="#fff" stroke="#cbd5e1"/><text x="351" y="338" text-anchor="middle" font-size="11" fill="#374151">Geofence 300 m</text><text x="351" y="352" text-anchor="middle" font-size="11" fill="#374151">(fixed circle around site)</text>
<g transform="translate(40,66)"><rect width="190" height="26" rx="13" fill="#ffffffee" stroke="#cbd5e1"/><text x="95" y="18" text-anchor="middle" font-size="12" fill="#374151">Google Maps · live tiles</text></g>
<rect x="604" y="52" width="332" height="380" rx="12" fill="#f9fafb" stroke="#e5e7eb"/>
<text x="622" y="82" font-size="15" font-weight="700" fill="#111827">Timeline</text>
<line x1="634" y1="102" x2="634" y2="386" stroke="#d1d5db" stroke-width="2"/>
<g font-size="12" fill="#374151">
<circle cx="634" cy="112" r="6" fill="#f59e0b"/><text x="650" y="116" font-weight="700" fill="#111827">Trip started</text><text x="650" y="132" fill="#6b7280">10:02 · manual + GPS</text>
<circle cx="634" cy="170" r="6" fill="#f59e0b"/><text x="650" y="174" font-weight="700" fill="#111827">Entered site geofence</text><text x="650" y="190" fill="#6b7280">10:41 · auto (geofence) · 62 m from site</text>
<circle cx="634" cy="228" r="6" fill="#f59e0b"/><text x="650" y="232" font-weight="700" fill="#111827">Arrived at site</text><text x="650" y="248" fill="#6b7280">10:41 · auto (geofence)</text>
<circle cx="634" cy="286" r="6" fill="#f59e0b"/><text x="650" y="290" font-weight="700" fill="#111827">Visit completed</text><text x="650" y="306" fill="#6b7280">11:35 · time on site 54 min</text>
<circle cx="634" cy="344" r="6" fill="#f59e0b"/><text x="650" y="348" font-weight="700" fill="#111827">Returned</text><text x="650" y="364" fill="#6b7280">12:20 · distance 18.4 km</text>
</g>
<text x="622" y="412" font-size="11" fill="#6b7280">Example data. Open route in Google Maps link below the map.</text>
</g>
</svg>
