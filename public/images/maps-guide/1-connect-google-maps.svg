<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="t d"><title id="t">How to connect Google Maps</title><desc id="d">Five steps: create a Google Cloud project, enable Maps JavaScript API, create and restrict a key, add it on the server, choose Google Maps in the app.</desc>
<rect width="960" height="420" fill="#ffffff"/>
<text x="480" y="38" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#111827">Connect Google Maps in 5 steps</text>
<g font-family="Arial,sans-serif">
<g transform="translate(24,70)"><rect width="168" height="280" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><circle cx="84" cy="34" r="20" fill="#2563eb"/><text x="84" y="41" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">1</text><text x="84" y="78" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Google Cloud</text><text x="84" y="104" text-anchor="middle" font-size="13" fill="#374151">console.cloud.google.com</text><text x="84" y="132" text-anchor="middle" font-size="13" fill="#374151">Create or pick a project</text><text x="84" y="154" text-anchor="middle" font-size="13" fill="#374151">Turn on Billing</text><text x="84" y="176" text-anchor="middle" font-size="12" fill="#6b7280">(Google gives a monthly</text><text x="84" y="194" text-anchor="middle" font-size="12" fill="#6b7280">free credit; billing is</text><text x="84" y="212" text-anchor="middle" font-size="12" fill="#6b7280">still required)</text></g>
<g transform="translate(206,70)"><rect width="168" height="280" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><circle cx="84" cy="34" r="20" fill="#2563eb"/><text x="84" y="41" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">2</text><text x="84" y="78" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Enable the API</text><text x="84" y="108" text-anchor="middle" font-size="13" fill="#374151">APIs &amp; Services →</text><text x="84" y="128" text-anchor="middle" font-size="13" fill="#374151">Library</text><rect x="14" y="146" width="140" height="44" rx="8" fill="#fff" stroke="#9ca3af"/><text x="84" y="173" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">Maps JavaScript API</text><text x="84" y="214" text-anchor="middle" font-size="13" fill="#374151">Click Enable</text></g>
<g transform="translate(388,70)"><rect width="168" height="280" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><circle cx="84" cy="34" r="20" fill="#2563eb"/><text x="84" y="41" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">3</text><text x="84" y="78" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Create the key</text><text x="84" y="108" text-anchor="middle" font-size="13" fill="#374151">Credentials →</text><text x="84" y="128" text-anchor="middle" font-size="13" fill="#374151">Create credentials →</text><text x="84" y="148" text-anchor="middle" font-size="13" fill="#374151">API key</text><rect x="14" y="166" width="140" height="62" rx="8" fill="#fef3c7" stroke="#d97706"/><text x="84" y="188" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">RESTRICT IT</text><text x="84" y="206" text-anchor="middle" font-size="11" fill="#92400e">Websites: your domain</text><text x="84" y="220" text-anchor="middle" font-size="11" fill="#92400e">API: Maps JavaScript</text></g>
<g transform="translate(570,70)"><rect width="168" height="280" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><circle cx="84" cy="34" r="20" fill="#2563eb"/><text x="84" y="41" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">4</text><text x="84" y="78" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Add on server</text><text x="84" y="108" text-anchor="middle" font-size="13" fill="#374151">Vercel → Project →</text><text x="84" y="128" text-anchor="middle" font-size="13" fill="#374151">Settings → Env vars</text><rect x="10" y="146" width="148" height="40" rx="8" fill="#111827"/><text x="84" y="171" text-anchor="middle" font-size="11" font-family="Consolas,monospace" fill="#a7f3d0">GOOGLE_MAPS_API_KEY</text><text x="84" y="214" text-anchor="middle" font-size="13" fill="#374151">Paste the key, save,</text><text x="84" y="234" text-anchor="middle" font-size="13" fill="#374151">then redeploy</text></g>
<g transform="translate(752,70)"><rect width="184" height="280" rx="14" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><circle cx="92" cy="34" r="20" fill="#059669"/><text x="92" y="41" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">5</text><text x="92" y="78" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Choose in the app</text><text x="92" y="108" text-anchor="middle" font-size="13" fill="#374151">Uniklife AI Integration</text><text x="92" y="128" text-anchor="middle" font-size="13" fill="#374151">→ Google Maps</text><rect x="14" y="146" width="156" height="40" rx="8" fill="#fff" stroke="#059669" stroke-width="2"/><text x="92" y="171" text-anchor="middle" font-size="13" font-weight="700" fill="#065f46">● Google Maps</text><text x="92" y="214" text-anchor="middle" font-size="13" fill="#374151">Press “Test map”,</text><text x="92" y="234" text-anchor="middle" font-size="13" fill="#374151">then Save</text></g>
<g fill="#6b7280" font-size="26" font-family="Arial,sans-serif"><text x="195" y="215">›</text><text x="377" y="215">›</text><text x="559" y="215">›</text><text x="741" y="215">›</text></g>
</g>
<text x="480" y="392" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#6b7280">Illustration of the steps. Google’s menu names can change; the key is a browser key — never share a key that has no restrictions.</text>
</svg>
