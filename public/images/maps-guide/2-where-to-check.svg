<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="t d"><title id="t">Where to check the Google Maps connection</title><desc id="d">Menu path Administration, Uniklife AI Integration, Google Maps tab, showing two cards: Google Maps and Stationary GIS fence, with a Test map button.</desc>
